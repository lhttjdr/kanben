<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地圖</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; width: 100%; height: 100%; background: #ece8da; }
  #panel {
    position: absolute; left: 8px; top: 8px; z-index: 2;
    font: 13px/1.6 "Noto Serif CJK TC", "Source Han Serif TC", serif;
    background: rgba(252, 250, 242, 0.92); border: 1px solid #b9a98a; padding: 4px 8px;
  }
  #panel:empty { display: none; }
  #panel label { display: block; white-space: nowrap; }
  #panel input[type=range] { width: 90px; vertical-align: middle; }
  body.still .maplibregl-ctrl-top-right, body.still #panel,
  body.still .maplibregl-ctrl-attrib-button { display: none !important; }
  body.still .maplibregl-ctrl-attrib { font-size: 8px !important; line-height: 1.4; padding: 0 4px !important;
    min-height: 0 !important; border-radius: 3px !important; }
  body.still .maplibregl-ctrl-attrib-inner { line-height: 1.4; }
  #err { position: absolute; inset: 0; display: none; place-items: center; color: #7a2b2b;
    font: 15px serif; text-align: center; padding: 1em; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel"></div>
<div id="err"></div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="map.js"></script>
</body>
</html>
