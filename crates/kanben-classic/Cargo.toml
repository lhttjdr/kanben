[package]
name = "kanben-classic"
description = "哂蟹齋排版器文本處理部分的 Rust 移植（經作者許可），輸出與原版逐字相同"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
fancy-regex = { version = "0.20", default-features = false, features = ["std", "perf"] }  # \d \s \w 已譯成 ASCII 類，不需要 Unicode 表；perf 帶字面量預篩，快兩三倍

[dev-dependencies]
serde_json = "1"
