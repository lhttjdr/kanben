name: CI / Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 按 mise.toml 安装 Rust 1.99.1、wasm32 目标与 wasm-pack
      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      - name: 检查
        run: mise run lint

      - name: 测试
        run: mise run test

      - name: 编译 wasm
        run: mise run build

      - name: 示例 HTML
        run: |
          mise run example
          cp examples/通鑑.html web/example.html

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
