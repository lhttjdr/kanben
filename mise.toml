[tools]
rust = { version = "1.99.1", profile = "minimal", targets = "wasm32-unknown-unknown", components = "rustfmt,clippy" }
"cargo:wasm-pack" = "0.14.0"

[tasks.test]
description = "运行全部测试"
run = "cargo test --workspace"

[tasks.build]
description = "编译 wasm 到 web/pkg 与 web/classic/pkg"
run = [
  "wasm-pack build crates/kanben-wasm --target web --release --out-dir ../../web/pkg --no-typescript",
  "wasm-pack build crates/kanben-classic-wasm --target web --release --out-dir ../../web/classic/pkg --no-typescript",
]

[tasks.serve]
description = "本地预览编辑器 http://localhost:8765"
depends = ["build"]
run = "python3 -m http.server 8765 -d web"

[tasks.example]
description = "命令行排印示例到 examples/通鑑.html"
run = "cargo run -q -p kanben -- examples/通鑑.kb -o examples/通鑑.html"

[tasks.lint]
description = "格式与 clippy 检查"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets -- -D warnings"]

[tasks.fonts]
description = "下载开源字體并切片到 web/fonts（需要 uv）"
run = "uv run --with uharfbuzz==0.57.0 --with fonttools==4.60.1 --with brotli==1.1.0 tools/fonts.py"

[tasks.classic-record]
description = "在对照版里重录原版各函数的输入输出（需先 mise run serve，并有无头 Chromium 在 9335 端口）"
run = "node tools/classic/record.mjs 9335 http://localhost:8765/ref/type/set/ crates/kanben-classic/tests/corpus crates/kanben-classic/tests/fixtures"
