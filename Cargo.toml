[workspace]
resolver = "3"
members = ["crates/kanben", "crates/kanben-classic", "crates/kanben-classic-wasm", "crates/kanben-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# 原版排法的 wasm 主要是正則引擎，按體積優化。
[profile.release.package.kanben-classic-wasm]
opt-level = "z"
[profile.release.package.kanben-classic]
opt-level = "z"
[profile.release.package.fancy-regex]
opt-level = "z"
[profile.release.package.regex-automata]
opt-level = "z"
[profile.release.package.regex-syntax]
opt-level = "z"
